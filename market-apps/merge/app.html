<style>/* ------------------------------------------------------------------ *
 * Palette
 * ------------------------------------------------------------------ */

:root {
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  --code-size: 13px;
  --lh: 20px;
  --tab: 4;

  --bg: #f7f7f5;
  --panel: #efefec;
  --panel-2: #e6e6e2;
  --surface: #ffffff;
  --edge: #deded8;
  --edge-soft: #e9e9e4;
  --text: #1f2328;
  --muted: #6b6f76;
  --faint: #9a9da4;
  --accent: #2f6fde;
  --accent-soft: #d6e4fb;
  --accent-bg: rgba(47, 111, 222, 0.08);
  --on-accent: #fff;
  --danger: #c0392b;
  --shadow: 0 10px 30px rgba(20, 20, 30, 0.14);

  /* Differences: the left side as removed, the right as added. */
  --del-bg: #ffebe9;
  --del-hi: #ffc1bb;
  --del-ink: #b42318;
  --ins-bg: #e6f6ea;
  --ins-hi: #aceebb;
  --ins-ink: #1a7f37;
  --chg-ink: #b25e00;
  --chg-bg: #fff4e0;
  --ign-bg: #f0f0f2;
  --filler: repeating-linear-gradient(135deg, transparent 0 5px, rgba(0, 0, 0, 0.045) 5px 6px);
  --fold-bg: #eef3fb;
  --hit: #ffe58a;
  --hit-cur: #ffb44a;
  --gutter-bg: #f6f6f4;
  --gutter-ink: #9a9da4;

  /* Syntax */
  --tk-comment: #6e7781;
  --tk-string: #0a3069;
  --tk-number: #0550ae;
  --tk-keyword: #cf222e;
  --tk-type: #953800;
  --tk-literal: #0550ae;
  --tk-function: #8250df;
  --tk-meta: #6639ba;
  --tk-regex: #116329;
  --tk-variable: #953800;
  --tk-tag: #116329;
  --tk-attr: #0550ae;
  --tk-property: #0550ae;
  --tk-heading: #0550ae;
  --tk-link: #0969da;
  --tk-code: #0a3069;
  --tk-inserted: #116329;
  --tk-deleted: #82071e;
  --tk-escape: #0550ae;
  --tk-section: #cf222e;
  --tk-selector: #6639ba;
}

:root[data-theme='dark'] {
  --bg: #0d1411;
  --panel: #151e19;
  --panel-2: #202e24;
  --surface: #101714;
  --edge: #34483a;
  --edge-soft: #26372b;
  --text: #edf4ed;
  --muted: #a9bbb0;
  --faint: #6c6f7d;
  --accent: #c8f27b;
  --accent-soft: #334b2b;
  --accent-bg: rgba(200, 242, 123, 0.1);
  --on-accent: #16200e;
  --danger: #ff7b6e;
  --shadow: 0 12px 34px rgba(0, 0, 0, 0.55);

  --del-bg: rgba(248, 81, 73, 0.13);
  --del-hi: rgba(248, 81, 73, 0.38);
  --del-ink: #ff8b82;
  --ins-bg: rgba(46, 160, 67, 0.14);
  --ins-hi: rgba(46, 160, 67, 0.4);
  --ins-ink: #6fdd8b;
  --chg-ink: #f0b44a;
  --chg-bg: rgba(240, 180, 74, 0.12);
  --ign-bg: rgba(255, 255, 255, 0.04);
  --filler: repeating-linear-gradient(135deg, transparent 0 5px, rgba(255, 255, 255, 0.05) 5px 6px);
  --fold-bg: rgba(110, 162, 255, 0.09);
  --hit: rgba(255, 214, 10, 0.4);
  --hit-cur: rgba(255, 150, 30, 0.7);
  --gutter-bg: #131418;
  --gutter-ink: #5f6270;

  --tk-comment: #8b949e;
  --tk-string: #a5d6ff;
  --tk-number: #79c0ff;
  --tk-keyword: #ff7b72;
  --tk-type: #ffa657;
  --tk-literal: #79c0ff;
  --tk-function: #d2a8ff;
  --tk-meta: #d2a8ff;
  --tk-regex: #7ee787;
  --tk-variable: #ffa657;
  --tk-tag: #7ee787;
  --tk-attr: #79c0ff;
  --tk-property: #79c0ff;
  --tk-heading: #79c0ff;
  --tk-link: #58a6ff;
  --tk-code: #a5d6ff;
  --tk-inserted: #7ee787;
  --tk-deleted: #ffa198;
  --tk-escape: #79c0ff;
  --tk-section: #ff7b72;
  --tk-selector: #d2a8ff;
}

* { box-sizing: border-box; }

/* Layout rules below set `display`, which would otherwise outrank `hidden`. */
[hidden] { display: none !important; }

html, body { height: 100%; margin: 0; }
@supports (height: 100dvh) {
  body { height: 100dvh; }
}
html { overscroll-behavior: none; }

body {
  display: flex;
  flex-direction: column;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  font-size: 14px;
  -webkit-font-smoothing: antialiased;
  padding: env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left);
}

button, input, select, textarea { font: inherit; color: inherit; }
button { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
::selection { background: var(--accent-soft); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* ------------------------------------------------------------------ *
 * Buttons and fields
 * ------------------------------------------------------------------ */

.button {
  border: 1px solid var(--edge);
  background: var(--surface);
  border-radius: 9px;
  padding: 8px 16px;
  cursor: pointer;
  white-space: nowrap;
  transition: background 0.12s, border-color 0.12s;
}
.button:hover { background: var(--panel); }
.button:disabled { opacity: 0.5; cursor: default; }
.button--primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
.button--primary:hover:not(:disabled) { background: var(--accent); filter: brightness(1.08); }
.button .arrow { display: inline-block; transition: transform 0.15s; }
.button:hover:not(:disabled) .arrow { transform: translateX(3px); }
[dir='rtl'] .button .arrow { transform: scaleX(-1); }
[dir='rtl'] .button:hover:not(:disabled) .arrow { transform: scaleX(-1) translateX(3px); }

.icon-button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 32px;
  height: 32px;
  padding: 0;
  border: 1px solid transparent;
  border-radius: 8px;
  background: none;
  color: var(--muted);
  cursor: pointer;
  position: relative;
  flex: none;
}
.icon-button:hover:not(:disabled) { background: var(--panel-2); color: var(--text); }
.icon-button:disabled { opacity: 0.35; cursor: default; }
.icon-button[aria-pressed='true'] { background: var(--accent-bg); color: var(--accent); border-color: var(--accent-soft); }
.icon-button--badge::after {
  content: '';
  position: absolute;
  top: 5px;
  inset-inline-end: 5px;
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--accent);
}

.link-button { border: 0; background: none; padding: 0; color: var(--accent); cursor: pointer; }
.link-button:hover { text-decoration: underline; }

.field {
  width: 100%;
  border: 1px solid var(--edge);
  border-radius: 8px;
  background: var(--surface);
  padding: 7px 10px;
  outline: none;
}
.field:focus { border-color: var(--accent); }
textarea.field { resize: vertical; font-family: var(--mono); font-size: 12.5px; line-height: 1.5; }

/* ------------------------------------------------------------------ *
 * Top bar
 * ------------------------------------------------------------------ */

.topbar {
  display: flex;
  align-items: center;
  gap: 8px;
  height: 48px;
  padding: 0 10px;
  border-bottom: 1px solid var(--edge);
  background: var(--panel);
  flex: none;
}
.brand {
  display: flex;
  align-items: center;
  gap: 8px;
  border: 0;
  background: none;
  padding: 6px 8px;
  border-radius: 8px;
  cursor: pointer;
  font-weight: 650;
  font-size: 15px;
  letter-spacing: -0.01em;
}
.brand:hover { background: var(--panel-2); }
.brand img { display: block; }
.crumbs {
  display: flex;
  align-items: center;
  gap: 6px;
  min-width: 0;
  flex: 1;
  color: var(--muted);
  overflow: hidden;
  white-space: nowrap;
}
.crumb {
  border: 0;
  background: none;
  padding: 4px 6px;
  border-radius: 6px;
  color: inherit;
  cursor: pointer;
  overflow: hidden;
  text-overflow: ellipsis;
  min-width: 0;
}
button.crumb:hover { background: var(--panel-2); color: var(--text); }
.crumb--current { color: var(--text); font-weight: 550; cursor: default; }
.crumb-sep { color: var(--faint); flex: none; }
.crumb-pair { display: inline-flex; gap: 6px; align-items: center; }
.crumb-pair svg { width: 14px; height: 14px; color: var(--faint); }
.topbar-actions { display: flex; gap: 2px; margin-inline-start: auto; }

.main { flex: 1; min-height: 0; display: flex; flex-direction: column; position: relative; }
.screen { flex: 1; min-height: 0; display: flex; flex-direction: column; }

/* ------------------------------------------------------------------ *
 * Start
 * ------------------------------------------------------------------ */

.start { flex: 1; overflow: auto; }
.start-inner { max-width: 860px; margin: 0 auto; padding: 48px 20px 32px; }
.start-title { font-size: 30px; letter-spacing: -0.02em; margin: 0 0 10px; font-weight: 700; }
.start-lead { color: var(--muted); font-size: 15px; line-height: 1.55; margin: 0 0 28px; max-width: 620px; }

.slots { display: grid; grid-template-columns: 1fr auto 1fr; gap: 14px; align-items: center; }
.slot {
  border: 1.5px dashed var(--edge);
  border-radius: 14px;
  padding: 18px;
  background: var(--surface);
  min-width: 0;
  transition: border-color 0.12s, background 0.12s;
}
.slot--over { border-color: var(--accent); background: var(--accent-bg); }
.slot--filled { border-style: solid; }
.slot-label { font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--faint); font-weight: 600; margin-bottom: 10px; }
.slot-picked { display: flex; align-items: center; gap: 8px; min-height: 26px; margin-bottom: 14px; min-width: 0; }
.slot-icon { display: inline-flex; color: var(--faint); }
.slot-icon:empty { display: none; }
.slot-name { font-weight: 600; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--faint); }
.slot--filled .slot-name { color: var(--text); }
.slot--filled .slot-icon { color: var(--accent); }
.slot-buttons { display: flex; gap: 8px; flex-wrap: wrap; }
.slot-hint { margin: 12px 0 0; color: var(--faint); font-size: 12.5px; }
.swap { width: 38px; height: 38px; }

.start-actions { margin-top: 22px; display: flex; justify-content: center; }
.start-actions .button { padding: 11px 30px; font-size: 15px; }
.start-note { margin: 16px auto 0; color: var(--muted); font-size: 13px; text-align: center; max-width: 560px; line-height: 1.5; }

.recent { margin-top: 36px; }
.recent-title { font-size: 13px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--faint); margin: 0 0 8px; font-weight: 600; }
.recent-list { list-style: none; margin: 0; padding: 0; border: 1px solid var(--edge); border-radius: 12px; background: var(--surface); overflow: hidden; }
.recent-item { display: flex; align-items: center; border-top: 1px solid var(--edge-soft); }
.recent-item:first-child { border-top: 0; }
.recent-open {
  flex: 1;
  min-width: 0;
  display: flex;
  align-items: center;
  gap: 8px;
  border: 0;
  background: none;
  padding: 10px 14px;
  text-align: start;
  cursor: pointer;
}
.recent-open:hover { background: var(--panel); }
.recent-names { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.recent-names b { font-weight: 600; }
.recent-arrow { color: var(--faint); margin: 0 4px; }
.recent-when { margin-inline-start: auto; color: var(--faint); font-size: 12.5px; white-space: nowrap; padding-inline-start: 8px; }
.recent-item .icon-button { margin-inline-end: 6px; }
.recent-item svg { width: 16px; height: 16px; }

.start-version { margin: 36px 0 0; text-align: center; color: var(--faint); font-size: 12px; }
.start-update { margin-top: 6px; }

.drop-veil {
  position: fixed;
  inset: 0;
  z-index: 50;
  display: flex;
  align-items: center;
  justify-content: center;
  background: color-mix(in srgb, var(--bg) 80%, transparent);
  border: 3px dashed var(--accent);
  pointer-events: none;
  font-size: 18px;
  font-weight: 600;
  color: var(--accent);
}

/* ------------------------------------------------------------------ *
 * Toolbars and status bars
 * ------------------------------------------------------------------ */

.toolbar {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 6px 10px;
  border-bottom: 1px solid var(--edge);
  background: var(--bg);
  flex: none;
  flex-wrap: wrap;
  min-height: 46px;
}
.toolbar-gap { flex: 1; }
.tool-group { display: flex; align-items: center; gap: 2px; }
.tool-group + .tool-group { padding-inline-start: 6px; border-inline-start: 1px solid var(--edge); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  border: 1px solid var(--edge);
  background: var(--surface);
  border-radius: 999px;
  padding: 4px 10px;
  font-size: 13px;
  cursor: pointer;
  color: var(--muted);
}
.chip b { font-weight: 600; color: var(--text); font-variant-numeric: tabular-nums; }
.chip[aria-pressed='false'] { background: none; opacity: 0.55; }
.chip[aria-pressed='false'] .dot { background: transparent !important; box-shadow: inset 0 0 0 1.5px var(--faint); }
.dot { width: 9px; height: 9px; border-radius: 50%; flex: none; display: inline-block; }
.dot--different { background: var(--chg-ink); }
.dot--left { background: var(--del-ink); }
.dot--right { background: var(--ins-ink); }
.dot--same { background: var(--faint); }
.dot--pending { background: var(--edge); }
.dot--error { background: var(--danger); }

.search {
  display: flex;
  align-items: center;
  gap: 6px;
  border: 1px solid var(--edge);
  border-radius: 8px;
  background: var(--surface);
  padding: 0 8px;
  height: 32px;
  color: var(--faint);
}
.search:focus-within { border-color: var(--accent); }
.search svg { width: 16px; height: 16px; }
.search input { border: 0; outline: none; background: none; width: 170px; padding: 0; color: var(--text); }
.search input::-webkit-search-cancel-button { cursor: pointer; }
.find-count { font-size: 12px; white-space: nowrap; font-variant-numeric: tabular-nums; }

.statusbar {
  display: flex;
  align-items: center;
  gap: 12px;
  min-height: 28px;
  padding: 4px 12px calc(4px + env(safe-area-inset-bottom));
  border-top: 1px solid var(--edge);
  background: var(--panel);
  color: var(--muted);
  font-size: 12.5px;
  flex: none;
}
.status-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.progress { width: 140px; height: 5px; border-radius: 3px; background: var(--edge); overflow: hidden; flex: none; margin-inline-start: auto; }
.progress-bar { display: block; height: 100%; width: 0; background: var(--accent); transition: width 0.15s; }

/* ------------------------------------------------------------------ *
 * Folder list
 * ------------------------------------------------------------------ */

.list-head, .item {
  display: grid;
  grid-template-columns: minmax(180px, 1fr) 118px 88px 88px 142px 142px;
  align-items: center;
}
.list-head {
  border-bottom: 1px solid var(--edge);
  background: var(--panel);
  font-size: 12px;
  color: var(--muted);
  flex: none;
  padding-inline-end: var(--scrollbar, 0px);
}
.col {
  border: 0;
  background: none;
  text-align: start;
  padding: 6px 10px;
  cursor: pointer;
  color: inherit;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  display: flex;
  align-items: center;
  gap: 4px;
}
.col:hover { color: var(--text); }
.col-size { justify-content: flex-end; }
.col[aria-sort]::after { content: '▲'; font-size: 8px; }
.col[aria-sort='descending']::after { content: '▼'; }

.list { flex: 1; min-height: 0; overflow: auto; position: relative; outline: none; }
.list-sizer { position: relative; }
.list-rows { position: absolute; inset-inline: 0; top: 0; }
.list-empty { position: absolute; inset: 0; margin: 0; display: flex; align-items: center; justify-content: center; color: var(--faint); padding: 20px; text-align: center; }
.item { height: 28px; cursor: default; border-bottom: 1px solid transparent; user-select: none; }
.item:hover { background: var(--panel); }
.item--sel { background: var(--accent-bg) !important; box-shadow: inset 2px 0 var(--accent); }
.list:focus .item--sel { background: var(--accent-soft) !important; }
.item > span { padding: 0 10px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .num { text-align: end; font-variant-numeric: tabular-nums; color: var(--muted); font-size: 13px; }
.item .date { color: var(--muted); font-size: 12.5px; font-variant-numeric: tabular-nums; }
.item-name { display: flex !important; align-items: center; gap: 6px; min-width: 0; }
.item-name .label { overflow: hidden; text-overflow: ellipsis; }
.item-name .folder-part { color: var(--faint); }
.twisty { width: 16px; height: 16px; display: inline-flex; align-items: center; justify-content: center; flex: none; color: var(--faint); border: 0; background: none; padding: 0; cursor: pointer; }
.twisty svg { width: 14px; height: 14px; transition: transform 0.12s; }
[dir='rtl'] .twisty svg { transform: scaleX(-1); }
.twisty--open svg, [dir='rtl'] .twisty--open svg { transform: rotate(90deg); }
.kind { display: inline-flex; color: var(--faint); }
.kind svg { width: 16px; height: 16px; }
.item[data-kind='dir'] .kind { color: #c9a227; }
.item-status { display: flex !important; align-items: center; gap: 6px; font-size: 12.5px; }
.item.st-different .item-status { color: var(--chg-ink); }
.item.st-left .item-status { color: var(--del-ink); }
.item.st-right .item-status { color: var(--ins-ink); }
.item.st-same .item-status { color: var(--faint); }
.item.st-error .item-status { color: var(--danger); }
.item.st-pending .item-status { color: var(--faint); }
.item.st-left .item-name .label { color: var(--del-ink); }
.item.st-right .item-name .label { color: var(--ins-ink); }
.item.st-different .item-name .label { color: var(--chg-ink); }
.item.st-same.f-file .item-name .label { color: var(--text); }

/* ------------------------------------------------------------------ *
 * File heads
 * ------------------------------------------------------------------ */

.file-heads { display: grid; grid-template-columns: 1fr 1fr; border-bottom: 1px solid var(--edge); background: var(--panel); flex: none; padding-inline-end: 14px; }
.file-heads--one { grid-template-columns: 1fr; }
.file-head { display: flex; align-items: center; gap: 8px; padding: 5px 12px; min-width: 0; font-size: 12.5px; }
.file-head + .file-head { border-inline-start: 1px solid var(--edge); }
.file-head .path { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; direction: ltr; unicode-bidi: plaintext; }
.file-head .side { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.08em; font-weight: 700; flex: none; }
.file-head--left .side { color: var(--del-ink); }
.file-head--right .side { color: var(--ins-ink); }
.file-head .info { margin-inline-start: auto; color: var(--faint); white-space: nowrap; display: flex; gap: 8px; flex: none; }
.file-head .missing { color: var(--faint); font-style: italic; }

/* ------------------------------------------------------------------ *
 * Text compare
 * ------------------------------------------------------------------ */

.file-body { flex: 1; min-height: 0; display: flex; position: relative; background: var(--surface); }
.diff { flex: 1; min-width: 0; display: flex; }
.panes { flex: 1; min-width: 0; display: grid; grid-template-columns: 1fr 1fr; }
.diff--unified .panes { grid-template-columns: 1fr; }
.pane {
  overflow: auto;
  position: relative;
  min-width: 0;
  font-family: var(--mono);
  font-size: var(--code-size);
  line-height: var(--lh);
  tab-size: var(--tab);
  -moz-tab-size: var(--tab);
  outline: none;
  overscroll-behavior: contain;
}
.pane + .pane { border-inline-start: 1px solid var(--edge); }
.sizer { position: relative; min-width: 100%; }
.rows { position: absolute; top: 0; left: 0; min-width: 100%; will-change: transform; }
.r { display: flex; height: var(--lh); white-space: pre; }
.ln {
  position: sticky;
  left: 0;
  z-index: 1;
  flex: none;
  width: var(--gutter);
  padding: 0 8px 0 4px;
  text-align: right;
  color: var(--gutter-ink);
  background: var(--gutter-bg);
  border-right: 1px solid var(--edge-soft);
  user-select: none;
  font-size: 0.92em;
}
.diff--unified .ln + .ln { left: var(--gutter); }
.tx { flex: 1; padding: 0 16px 0 8px; }
.r.del { background: var(--del-bg); }
.r.ins { background: var(--ins-bg); }
.r.del .ln { background: color-mix(in srgb, var(--del-bg) 70%, var(--gutter-bg)); color: var(--del-ink); }
.r.ins .ln { background: color-mix(in srgb, var(--ins-bg) 70%, var(--gutter-bg)); color: var(--ins-ink); }
.r.filler { background: var(--filler); }
.r.filler .ln { background: var(--gutter-bg); }
.r.ign, .r.ign.del, .r.ign.ins { background: var(--ign-bg); }
.r.ign .ln { color: var(--gutter-ink); background: var(--gutter-bg); }
.r.cur .ln { box-shadow: inset 3px 0 var(--accent); }
.r.del .hl { background: var(--del-hi); border-radius: 2px; }
.r.ins .hl { background: var(--ins-hi); border-radius: 2px; }
.r.fold { background: var(--fold-bg); color: var(--accent); cursor: pointer; font-family: var(--font); font-size: 12px; }
.r.fold .tx { display: flex; align-items: center; gap: 6px; }
.r.fold:hover { filter: brightness(0.97); }
.hit { background: var(--hit); border-radius: 2px; box-shadow: 0 0 0 1px var(--hit); }
.hit-cur { background: var(--hit-cur); box-shadow: 0 0 0 1px var(--hit-cur); }
.sp, .tab { position: relative; }
.sp::before { content: '·'; position: absolute; left: 0; right: 0; text-align: center; color: var(--faint); opacity: 0.8; }
.tab::before { content: '→'; position: absolute; left: 0; color: var(--faint); opacity: 0.8; }
.eol { color: var(--faint); font-size: 0.8em; padding: 0 3px; margin-inline-start: 2px; border-radius: 3px; user-select: none; }
.r.del .eol.hl, .r.ins .eol.hl { color: var(--text); }
.cut { color: var(--faint); font-style: italic; font-family: var(--font); font-size: 0.85em; user-select: none; }

.tk-comment { color: var(--tk-comment); font-style: italic; }
.tk-string { color: var(--tk-string); }
.tk-number { color: var(--tk-number); }
.tk-keyword { color: var(--tk-keyword); }
.tk-type { color: var(--tk-type); }
.tk-literal { color: var(--tk-literal); }
.tk-function { color: var(--tk-function); }
.tk-meta { color: var(--tk-meta); }
.tk-regex { color: var(--tk-regex); }
.tk-variable { color: var(--tk-variable); }
.tk-tag { color: var(--tk-tag); }
.tk-attr { color: var(--tk-attr); }
.tk-property { color: var(--tk-property); }
.tk-heading { color: var(--tk-heading); font-weight: 700; }
.tk-emphasis { font-style: italic; }
.tk-strong { font-weight: 700; }
.tk-link { color: var(--tk-link); text-decoration: underline; text-underline-offset: 2px; }
.tk-code { color: var(--tk-code); }
.tk-inserted { color: var(--tk-inserted); }
.tk-deleted { color: var(--tk-deleted); }
.tk-escape { color: var(--tk-escape); }
.tk-section { color: var(--tk-section); font-weight: 700; }
.tk-selector { color: var(--tk-selector); }

.overview { position: relative; width: 14px; flex: none; border-inline-start: 1px solid var(--edge); background: var(--panel); cursor: pointer; touch-action: none; }
.overview canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.overview-view { position: absolute; left: 0; right: 0; border: 1px solid var(--muted); background: rgba(127, 127, 127, 0.14); border-radius: 2px; pointer-events: none; min-height: 4px; }

.file-message { margin: auto; text-align: center; color: var(--muted); padding: 24px; max-width: 520px; line-height: 1.6; }
.file-message strong { display: block; color: var(--text); font-size: 16px; margin-bottom: 6px; }

/* Pictures and binary files */
.media { flex: 1; overflow: auto; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: auto 1fr; align-content: start; }
.media-side { padding: 18px; display: flex; flex-direction: column; align-items: center; gap: 10px; min-width: 0; }
.media-side + .media-side { border-inline-start: 1px solid var(--edge); }
.media-side img {
  max-width: 100%;
  height: auto;
  image-rendering: auto;
  background: repeating-conic-gradient(#d8d8d8 0 25%, #fff 0 50%) 0 0 / 16px 16px;
  box-shadow: 0 0 0 1px var(--edge);
}
.media-caption { color: var(--muted); font-size: 12.5px; text-align: center; }
.media-note { grid-column: 1 / -1; margin: 0; text-align: center; padding: 10px; color: var(--muted); border-bottom: 1px solid var(--edge); background: var(--panel); font-size: 13px; }
.hex { font-family: var(--mono); font-size: 12.5px; line-height: 1.6; white-space: pre; direction: ltr; overflow-x: auto; max-width: 100%; }
.hex .off { color: var(--faint); }
.hex .bd { background: var(--del-hi); border-radius: 2px; }
.media-side--right .hex .bd { background: var(--ins-hi); }

/* ------------------------------------------------------------------ *
 * Overlays: dialogs, popovers, toasts
 * ------------------------------------------------------------------ */

.overlay {
  position: fixed;
  inset: 0;
  z-index: 40;
  background: rgba(10, 12, 18, 0.36);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
}
.dialog {
  background: var(--bg);
  border: 1px solid var(--edge);
  border-radius: 14px;
  box-shadow: var(--shadow);
  width: min(560px, 100%);
  max-height: min(86vh, 100%);
  display: flex;
  flex-direction: column;
}
.dialog-head { display: flex; align-items: center; gap: 8px; padding: 12px 12px 10px 18px; border-bottom: 1px solid var(--edge); }
.dialog-head h2 { margin: 0; font-size: 16px; flex: 1; }
.dialog-body { padding: 14px 18px 18px; overflow: auto; }
.dialog-foot { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 18px; border-top: 1px solid var(--edge); }

.settings-section + .settings-section { margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--edge-soft); }
.settings-section h3 { margin: 0 0 10px; font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--faint); }
.setting { display: grid; grid-template-columns: 180px 1fr; gap: 10px; align-items: center; margin-bottom: 10px; }
.setting > label, .setting > .setting-label { color: var(--muted); }
.setting--wide { grid-template-columns: 1fr; }
.setting--check { display: flex; align-items: flex-start; gap: 8px; cursor: pointer; }
.setting--check input { margin: 3px 0 0; accent-color: var(--accent); }
.setting-hint { display: block; font-size: 12px; color: var(--faint); margin-top: 3px; line-height: 1.45; }
.setting select.field { padding: 6px 8px; }
.segmented { display: inline-flex; border: 1px solid var(--edge); border-radius: 8px; overflow: hidden; background: var(--surface); flex-wrap: wrap; }
.segmented button { border: 0; background: none; padding: 6px 12px; cursor: pointer; color: var(--muted); }
.segmented button + button { border-inline-start: 1px solid var(--edge); }
.segmented button[aria-pressed='true'] { background: var(--accent-bg); color: var(--accent); font-weight: 600; }
.version-line { color: var(--muted); font-size: 13px; }

.keys { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.keys td { padding: 6px 4px; border-bottom: 1px solid var(--edge-soft); vertical-align: top; }
.keys td:first-child { white-space: nowrap; padding-inline-end: 16px; }
kbd {
  font-family: var(--mono);
  font-size: 12px;
  border: 1px solid var(--edge);
  border-bottom-width: 2px;
  border-radius: 5px;
  padding: 1px 6px;
  background: var(--surface);
}

.popover {
  position: fixed;
  z-index: 45;
  background: var(--bg);
  border: 1px solid var(--edge);
  border-radius: 12px;
  box-shadow: var(--shadow);
  padding: 12px 14px;
  width: 300px;
  max-height: calc(100vh - 80px);
  overflow: auto;
}
.popover h3 { margin: 0 0 8px; font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--faint); }
.popover h3:not(:first-child) { margin-top: 14px; }
.popover .setting { grid-template-columns: 1fr; gap: 4px; margin-bottom: 8px; }
.popover .setting--check { margin-bottom: 7px; }

.toast {
  position: fixed;
  left: 50%;
  bottom: calc(40px + env(safe-area-inset-bottom));
  transform: translate(-50%, 12px);
  z-index: 60;
  background: var(--text);
  color: var(--bg);
  padding: 9px 16px;
  border-radius: 10px;
  box-shadow: var(--shadow);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s, transform 0.2s;
  max-width: calc(100vw - 32px);
  font-size: 13.5px;
}
.toast--shown { opacity: 1; transform: translate(-50%, 0); }
.toast--error { background: var(--danger); color: #fff; }

/* ------------------------------------------------------------------ *
 * Narrow screens
 * ------------------------------------------------------------------ */

@media (max-width: 900px) {
  .list-head, .item { grid-template-columns: minmax(140px, 1fr) 112px 80px 80px; }
  .list-head .col-date, .item .date { display: none; }
}

@media (max-width: 640px) {
  .topbar { padding: 0 6px; gap: 4px; }
  .brand-name { display: none; }
  .start-inner { padding: 24px 16px; }
  .start-title { font-size: 24px; }
  .slots { grid-template-columns: 1fr; }
  .swap { justify-self: center; transform: rotate(90deg); }
  .list-head, .item { grid-template-columns: minmax(0, 1fr) 96px; }
  .list-head .col-size, .item .num { display: none; }
  .item { height: 40px; }
  .toolbar { gap: 4px; padding: 6px; }
  .search { flex: 1; min-width: 120px; }
  .search input { width: 100%; }
  .chip { padding: 4px 8px; font-size: 12.5px; }
  .file-head .info { display: none; }
  .file-heads { padding-inline-end: 0; }
  .setting { grid-template-columns: 1fr; gap: 4px; }
  .media { grid-template-columns: 1fr; }
  .media-side + .media-side { border-inline-start: 0; border-top: 1px solid var(--edge); }
  .icon-button { width: 36px; height: 36px; }
  .recent-when { display: none; }
  #first-diff, #last-diff, #folder-expand, #folder-collapse { display: none; }
  .tool-group + .tool-group { padding-inline-start: 2px; border-inline-start: 0; }
  .media { grid-template-rows: auto auto auto; }
}

@media (hover: none) {
  .item:hover { background: none; }
}
</style>
</head>

<main class="main">

<section id="start" class="start">
  <div class="start-inner">
    <h1 class="start-title" data-i18n="start">Compare folders and files</h1>
    <p class="start-lead" data-i18n="start">
      Pick two folders or two files. They are read here, in this page, and never changed or sent anywhere.
    </p>

    <div class="slots">
      <div class="slot" data-side="left">
        <div class="slot-label" data-i18n="start">Left</div>
        <div class="slot-picked" data-name="left">
          <span class="slot-icon"></span>
          <span class="slot-name"></span>
        </div>
        <div class="slot-buttons">
          <button class="button" type="button" data-pick="dir" data-side="left" data-i18n="start">Folder…</button>
          <button class="button" type="button" data-pick="file" data-side="left" data-i18n="start">File…</button>
        </div>
        <p class="slot-hint" data-i18n="start">or drop it here</p>
      </div>
      <button id="swap" class="icon-button swap" type="button" title="Swap sides" aria-label="Swap sides" data-i18n-attr="start">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7h13M16 3l4 4-4 4M17 17H4M8 13l-4 4 4 4"/></svg>
      </button>
      <div class="slot" data-side="right">
        <div class="slot-label" data-i18n="start">Right</div>
        <div class="slot-picked" data-name="right">
          <span class="slot-icon"></span>
          <span class="slot-name"></span>
        </div>
        <div class="slot-buttons">
          <button class="button" type="button" data-pick="dir" data-side="right" data-i18n="start">Folder…</button>
          <button class="button" type="button" data-pick="file" data-side="right" data-i18n="start">File…</button>
        </div>
        <p class="slot-hint" data-i18n="start">or drop it here</p>
      </div>
    </div>

    <div class="start-actions">
      <button id="compare" class="button button--primary" type="button" disabled><span data-i18n="start">Compare</span> <span class="arrow">&rarr;</span></button>
    </div>
