<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- The title and icon placeholders are filled from the lesson's lesson.json, the double-brace keys from
     strings.json in the lesson's language (build_scripts/build.mjs) -->
<title>Чарівні слова</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🪄</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<!-- The lesson's colours and decorations (theme.css in the lesson folder), on top of the engine style -->
<link rel="stylesheet" href="theme.css">

<link rel="manifest" href="../../manifest.webmanifest">
<meta name="theme-color" content="#d7f0ff">
<link rel="apple-touch-icon" href="../../apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Весела школа">
<script>
  if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("../../sw.js").catch(() => {}));
</script>
</head>
<!-- data-mode is filled from game.json: "assemble" (tiles), "aloud" (reading a word aloud) or "sentence" (reading
     a sentence aloud); each mode hides the others' blocks, .only-mic is for both reading-aloud modes -->
<body data-mode="assemble">
<header>
  <nav id="levels" class="levels" aria-label="Рівні"></nav>
  <div id="score" class="score only-mic" title="Бали: скільки прочитано без підказки" aria-live="polite"></div>
</header>

<main>
  <section class="board">
    <img id="picture" class="picture" alt="" hidden>
    <div class="word-row not-sentence">
      <div id="word" class="word" aria-label="Слово"></div>
      <button id="say-word" class="speaker big only-assemble" title="Послухати слово по складах" aria-label="Послухати слово"></button>
    </div>
    <p id="sentence" class="sentence only-sentence" aria-label="Фраза"></p>
    <p id="heard" class="heard only-mic" aria-live="polite"></p>
  </section>

  <button id="speak" class="mic only-mic" title="Прочитати вголос (Enter)">
    <span aria-hidden="true">🎤</span><span id="speak-label">Читати</span>
  </button>

  <p id="message" role="status"></p>

  <section id="reward" class="reward only-sentence" hidden aria-live="polite">
    <p id="reward-text" class="reward-text"></p>
    <button id="reward-play" class="speaker small" title="Послухати ще раз" aria-label="Послухати ще раз"></button>
  </section>

  <section class="controls">
    <button id="erase" class="btn only-assemble" title="Стерти останній склад (Backspace)">⌫ Стерти</button>
    <button id="check" class="btn primary only-assemble" title="Перевірити (Enter)">Перевірити</button>
    <button id="manual-ok" class="btn only-mic" hidden>👍 Вийшло</button>
    <button id="next" class="btn">Інше слово</button>
  </section>

  <section id="tiles" class="tiles only-assemble" aria-label="Склади й літери"></section>
  <p id="note" class="note only-mic" hidden></p>
</main>

<div id="overlay" class="overlay" hidden>
  <div class="card" role="dialog" aria-modal="true" aria-labelledby="overlay-title">
    <div id="overlay-icon" class="card-icon"></div>
    <h2 id="overlay-title"></h2>
    <p id="overlay-text"></p>
    <button id="overlay-btn" class="btn primary"></button>
  </div>
</div>

<div id="confetti" class="confetti" aria-hidden="true"></div>
<div class="grass" aria-hidden="true"></div>

<!-- Classic scripts, not modules: this way the game also opens by double-click, without a server -->
<script src="data.js"></script>
<script src="common.js"></script>
<script src="assemble.js"></script>

<a class="home-button" href="../" title="Усі уроки" aria-label="Усі уроки"><span aria-hidden="true">🏠</span><span class="home-button-text">Усі уроки</span></a>
<style>
  .home-button {
    position: fixed;
    z-index: 5;
    bottom: calc(14px + env(safe-area-inset-bottom));
    left: calc(12px + env(safe-area-inset-left));
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    min-width: 48px;
    height: 48px;
    padding: 0 16px 0 10px;
    border-radius: 999px;
    background: #fff;
    border: 3px solid #eadfcd;
    box-shadow: 0 3px 0 #eadfcd;
    color: #3d2b2f;
    font: 800 17px "Nunito", system-ui, sans-serif;
    line-height: 1;
    text-decoration: none;
    transition: transform 0.1s;
  }
  .home-button span:first-child { font-size: 22px; }
  .home-button:hover { transform: translateY(-2px); }
  .home-button:active { transform: translateY(2px); box-shadow: 0 1px 0 #eadfcd; }
  @media (max-width: 700px) {
    .home-button { width: 48px; padding: 0; }
    .home-button-text { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    .home-button { transition: none; }
  }
</style>
</body>
</html>
