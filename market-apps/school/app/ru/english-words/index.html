<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- The title and icon placeholders are filled from lesson.json, the double-brace keys from strings.json in the
     build's language (build_scripts/build.mjs) -->
<title>Скажи по-английски</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🗣️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">

<link rel="manifest" href="../../manifest.webmanifest">
<meta name="theme-color" content="#d7f0ff">
<link rel="apple-touch-icon" href="../../apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Весёлая школа">
<script>
  if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("../../sw.js").catch(() => {}));
</script>
</head>
<body>
<header>
  <nav id="topics" class="topics" aria-label="Темы"></nav>
  <div id="score" class="score" title="Очки: сколько раз удалось сказать слово" aria-live="polite"></div>
</header>

<main>
  <section class="board">
    <div class="picture-box">
      <img id="picture" class="picture" alt="">
      <div id="picture-stub" class="picture-stub" aria-hidden="true"></div>
    </div>
    <div id="word" class="word" lang="en"></div>
    <div id="translation" class="translation"></div>
  </section>

  <section class="actions">
    <button id="listen" class="round listen" title="Послушать слово (пробел)">
      <span class="round-icon" aria-hidden="true">🔊</span><span class="round-label">Послушай</span>
    </button>
    <button id="speak" class="round speak" title="Сказать слово (Enter)">
      <span class="round-icon" aria-hidden="true">🎤</span><span class="round-label">Скажи</span>
    </button>
  </section>

  <!-- data-no-data: shown by main.js when data.js is missing -->
  <p id="message" role="status" data-no-data="Нет data.js — соберите игру: npm run build"></p>

  <section class="controls">
    <button id="manual-ok" class="btn" hidden>👍 Получилось</button>
    <button id="next" class="btn">Другое слово</button>
  </section>

  <p id="note" class="note" hidden></p>
</main>

<div id="overlay" class="overlay" hidden>
  <div class="card" role="dialog" aria-modal="true" aria-labelledby="overlay-title">
    <div id="overlay-icon" class="card-icon"></div>
    <h2 id="overlay-title"></h2>
    <p id="overlay-text"></p>
    <button id="overlay-btn" class="btn primary">Дальше →</button>
  </div>
</div>

<div id="confetti" class="confetti" aria-hidden="true"></div>

<!-- Classic scripts, not modules: this way the game also opens by double-click, without a server -->
<script src="data.js"></script>
<script src="main.js"></script>

<a class="home-button" href="../" title="Все уроки" aria-label="Все уроки"><span aria-hidden="true">🏠</span><span class="home-button-text">Все уроки</span></a>
<style>
  .home-button {
    position: fixed;
    z-index: 5;
    bottom: calc(14px + env(safe-area-inset-bottom));
    left: calc(12px + env(safe-area-inset-left));
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    min-width: 48px;
    height: 48px;
    padding: 0 16px 0 10px;
    border-radius: 999px;
    background: #fff;
    border: 3px solid #eadfcd;
    box-shadow: 0 3px 0 #eadfcd;
    color: #3d2b2f;
    font: 800 17px "Nunito", system-ui, sans-serif;
    line-height: 1;
    text-decoration: none;
    transition: transform 0.1s;
  }
  .home-button span:first-child { font-size: 22px; }
  .home-button:hover { transform: translateY(-2px); }
  .home-button:active { transform: translateY(2px); box-shadow: 0 1px 0 #eadfcd; }
  @media (max-width: 700px) {
    .home-button { width: 48px; padding: 0; }
    .home-button-text { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    .home-button { transition: none; }
  }
</style>
</body>
</html>
