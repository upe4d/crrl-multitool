<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Текст и данные</title><link rel="stylesheet" href="style.css"></head><body><main><header><span>МУЛЬТИТУЛ / ИНСТРУМЕНТЫ</span><h1>Текст и данные</h1><p>Небольшие инструменты для повседневных задач. Текст обрабатывается в браузере.</p></header><section class="panel"><label for="tool">Инструмент</label><select id="tool"><option value="counter">Счётчик текста</option><option value="case">Регистр текста</option><option value="json">Форматирование JSON</option><option value="base64">Base64</option><option value="url">Кодирование URL</option><option value="hash">Хеш SHA-256</option><option value="password">Генератор паролей</option><option value="uuid">Генератор UUID</option></select><p id="description" class="description"></p><div id="input-area"><label for="input">Исходный текст</label><textarea id="input" rows="7" spellcheck="false" placeholder="Введите текст"></textarea></div><div class="options"><label id="mode-label" hidden>Действие <select id="mode"></select></label><label id="length-label" hidden>Длина пароля <input id="length" type="number" min="12" max="128" value="24"></label></div><div class="buttons"><button id="run" class="primary">Выполнить</button><button id="clear" class="secondary">Очистить</button></div><p id="status" role="status"></p><label for="output">Результат</label><textarea id="output" rows="7" spellcheck="false" readonly></textarea><div class="buttons"><button id="copy" class="secondary">Скопировать</button><button id="download" class="secondary">Скачать TXT</button></div></section></main><script src="app.js"></script></body></html>
